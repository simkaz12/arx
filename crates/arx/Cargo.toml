[package]
name = "arx"
version = "0.1.0"
edition.workspace = true

[dependencies]
arx-engine = { path = "../arx-engine" }
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10.9"
serde_json = "1.0.151"
serde_yaml = "0.9.34"
toml = "1.1.4"
toml_edit = "0.25.13"
tui-markdown = { version = "0.3", default-features = false }
unicode-width = "0.2.2"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
